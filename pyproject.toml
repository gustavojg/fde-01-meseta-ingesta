[project]
name = "meseta-ingesta"
version = "0.1.0"
description = "Order ingestion from Excel and email into the ERP of Transportes Meseta (FDE course, assignment 01)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gustavo" }]
dependencies = [
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.scripts]
meseta-ingesta = "meseta_ingesta.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meseta_ingesta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=meseta_ingesta --cov-report=term-missing"
